  - name: Collection Editing
    members:
      - name: insertCellAtIndexPath
        kind: method
        summary: Insert a single cell at the given index path
        arguments:
          - name: indexPath
            type: JSIndexPath
            summary: The index path of the inserted cell
          - name: animation
            type: CellAnimation
            default: UICollectionView.CellAnimation.default
        description: |
          When a new item is added to your data set, you can insert it without
          reloading the entire collection.

          ````
          JSClass("PlanetsViewController", UIViewController, {

            init: function(){
              PlanetsViewController.$super.init.call(this);
              this.planets = [
                {
                  name: "Mercury",
                  image: JSImage.initWithResourceName("MercuryIcon")
                },
                {
                  name: "Venus",
                  image: JSImage.initWithResourceName("VenusIcon")
                },
                {
                  name: "Earth",
                  image: JSImage.initWithResourceName("EarthIcon")
                }
                // ...
              ]
            },

            viewDidLoad: function(){
              PlanetsViewController.$super.viewDidLoad.call(this);
              this.collectionView.registerCellClassForReuseIdentifier('planet', PlanetCollectionCell);
            },

            cellForCollectionViewAtIndexPath: function(collectionView, indexPath){
              var cell = collectionView.dequeueReusableCellWithIdentifier('planet', indexPath);
              var planet = this.planets[indexPath.row];
              cell.nameLabel.text = planet.name;
              cell.imageView.image = planet.image;
              return cell;
            },

            discoverPlanetVulcan: function(){
              var indexPath = JSIndexPath(0, 1);
              this.planets.splice(indexPath.row, 0, {name: "Vulcan", image: JSImage.initWithResourceName("VulcanIcon")});
              this.collectionView.insertCellAtIndexPath(indexPath);
            }

          });
          ````
        note: You should always update your data source at the same time as
          calling `insertCellAtIndexPath()`
        see:
          - insertCellsAtIndexPaths()
      - name: insertCellsAtIndexPaths
        kind: method
        summary: Insert multiple cells at the given index paths
        arguments:
          - name: indexPaths
            type: JSIndexPath[]
            summary: The index paths of the inserted cells
          - name: animation
            type: CellAnimation
            default: UICollectionView.CellAnimation.default
        description: |
          When new items are added to your data set, you can insert them without
          reloading the entire collection.

          ````
          JSClass("PlanetsViewController", UIViewController, {

            init: function(){
              PlanetsViewController.$super.init.call(this);
              this.planets = [
                {
                  name: "Mercury",
                  image: JSImage.initWithResourceName("MercuryIcon")
                },
                {
                  name: "Venus",
                  image: JSImage.initWithResourceName("VenusIcon")
                },
                {
                  name: "Earth",
                  image: JSImage.initWithResourceName("EarthIcon")
                }
                // ...
              ]
            },

            viewDidLoad: function(){
              PlanetsViewController.$super.viewDidLoad.call(this);
              this.collectionView.registerCellClassForReuseIdentifier('planet', PlanetCollectionCell);
            },

            cellForCollectionViewAtIndexPath: function(collectionView, indexPath){
              var cell = collectionView.dequeueReusableCellWithIdentifier('planet', indexPath);
              var planet = this.planets[indexPath.row];
              cell.nameLabel.text = planet.name;
              cell.imageView.image = planet.image;
              return cell;
            },

            discoverPlanets: function(){
              var vulcanIndexPath = JSIndexPath(0, 1);
              var planetXIndexPath = JSIndexPath(0, 9);
              this.planets.splice(vulcanIndexPath.row, 0, {name: "Vulcan", image: JSImage.initWithResourceName("VulcanIcon")});
              this.planets.splice(planetXIndexPath.row, 0, {name: "Planet X", image: JSImage.initWithResourceName("PlanetXIcon")});
              this.collectionView.insertCellsAtIndexPaths([vulcanIndexPath, planetXIndexPath]);
            }

          });
          ````
        note: You should always update your data source at the same time as
          calling `insertCellsAtIndexPaths()`
        important: The index paths provided should match the index paths that
          the cells will have after all inserts are complete.

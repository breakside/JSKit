  - name: Selection
    members:
      - name: allowsMultipleSelection
        type: boolean
        summary: Indicates if the user can select mutliple items at a time
      - name: allowsEmptySelection
        type: boolean
        summary: Indicates that the user can de-select all cells
        description: |
          Defaults to `true`()
      - name: selectedIndexPaths
        type: JSIndexPath[]
        summary: The index paths of all selected cells
        description: |
          If you're using `allowsMultipleSelection`, this property will return
          the entire set of all selected cell index paths.

          If you aren't using `allowsMultipleSelection`, consider checking
          `selectedIndexPath` instead so you don't have to deal with a
          single-item array here.
      - name: selectedIndexPath
        type: JSIndexPath
        nullable: true
        summary: The index path of the single selected cell
        description: |
          If you're using `allowsMultipleSelection`, this property will be
          `null` if anything but 1 cell is selected.
      - name: setSelectedIndexPathAnimated
        kind: method
        summary: Set the selected index path with an animation
        arguments:
          - name: indexPath
            type: JSIndexPath
            nullable: true
            summary: The single index path to select
        description: |
          Setting the `indexPath`() to `null`() will deselect the current
          selection with an animation
      - name: contextSelectedIndexPaths
        type: JSIndexPath[]
        summary: The index paths of all cells that are context-selected
        description: |
          A context selection occurs when the user right clicks on a cell
          or a set of selected cells.

          Context selection can be different from the regular selection
          depending on exactly how the user clicks.
      - name: selectAll
        kind: method
        summary: Select all the cells in the collection
      - name: selectNone
        kind: method
        summary: Select none of the cells in the collection

      - name: deleteCellAtIndexPath
        kind: method
        summary: Remove a single cell at the given index path
        arguments:
          - name: indexPath
            type: JSIndexPath
            summary: The index path of the cell to delete
          - name: animation
            type: CellAnimation
            default: UICollectionView.CellAnimation.default
        description: |
          When an item is removed from your data set, you can remove it without
          reloading the entire collection.

          ````
          JSClass("PlanetsViewController", UIViewController, {

            init: function(){
              PlanetsViewController.$super.init.call(this);
              this.planets = [
                {
                  name: "Mercury",
                  image: JSImage.initWithResourceName("MercuryIcon")
                },
                {
                  name: "Venus",
                  image: JSImage.initWithResourceName("VenusIcon")
                },
                {
                  name: "Earth",
                  image: JSImage.initWithResourceName("EarthIcon")
                }
                // ...
              ]
            },

            viewDidLoad: function(){
              PlanetsViewController.$super.viewDidLoad.call(this);
              this.collectionView.registerCellClassForReuseIdentifier('planet', PlanetCollectionCell);
            },

            cellForCollectionViewAtIndexPath: function(collectionView, indexPath){
              var cell = collectionView.dequeueReusableCellWithIdentifier('planet', indexPath);
              var planet = this.planets[indexPath.row];
              cell.nameLabel.text = planet.name;
              cell.imageView.image = planet.image;
              return cell;
            },

            demotePluto: function(){
              var indexPath = JSIndexPath(0, 8);
              this.planets.splice(indexPath.row, 1);
              this.collectionView.deleteCellAtIndexPath(indexPath);
            }

          });
          ````
        note: You should always update your data source at the same time as
          calling `deleteCellAtIndexPath()`
        see:
          - deleteCellsAtIndexPaths()
      - name: deleteCellsAtIndexPaths
        kind: method
        summary: Delete multiple cells at the given index paths
        arguments:
          - name: indexPaths
            type: JSIndexPath[]
            summary: The index paths of the deleted cells
          - name: animation
            type: CellAnimation
            default: UICollectionView.CellAnimation.default
        description: |
          When items are removed from your data set, you can remove them without
          reloading the entire collection.

          ````
          JSClass("PlanetsViewController", UIViewController, {

            init: function(){
              PlanetsViewController.$super.init.call(this);
              this.planets = [
                {
                  name: "Mercury",
                  image: JSImage.initWithResourceName("MercuryIcon")
                },
                {
                  name: "Venus",
                  image: JSImage.initWithResourceName("VenusIcon")
                },
                {
                  name: "Earth",
                  image: JSImage.initWithResourceName("EarthIcon")
                }
                // ...
              ]
            },

            viewDidLoad: function(){
              PlanetsViewController.$super.viewDidLoad.call(this);
              this.collectionView.registerCellClassForReuseIdentifier('planet', PlanetCollectionCell);
            },

            cellForCollectionViewAtIndexPath: function(collectionView, indexPath){
              var cell = collectionView.dequeueReusableCellWithIdentifier('planet', indexPath);
              var planet = this.planets[indexPath.row];
              cell.nameLabel.text = planet.name;
              cell.imageView.image = planet.image;
              return cell;
            },

            demotePluto: function(){
              var indexPath = JSIndexPath(0, 8);
              this.planets.splice(indexPath.row, 1);
              this.collectionView.deleteCellsAtIndexPaths([indexPath]);
            }

          });
          ````
        note: You should always update your data source at the same time as
          calling `deleteCellsAtIndexPaths()`
        important: The index paths provided should match the index paths that
          the cells have after before any edits.

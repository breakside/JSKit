  - name: Supplimentary View Reuse
    members:
      - name: registerViewClassForReuseIdentifier
        kind: method
        summary: Tell the collection view which view class should be used
          to create supplimentary views when requsting the given identifier
        arguments:
          - name: viewClass
            type: JSClass
            summary: The `UICollectionReusableView` subclass to use when
              dequeuing a header or footer with the given identifier
          - name: identifier
            type: String
            summary: The identifier that links to the header/footer class
        description: |
          The collection view only displays supplimentary views that are visibile in the
          scrolling content area, and reuses them as the user scrolls.  This
          allows the collection view to perform well even when there are thousands of 
          cells and many sections in the collection.

          Typically, you'll register view classes when a collection view is
          created, and then use `dequeueReusableViewWithIdentifier()`.
          
          ````
          JSClass("PlanetsViewController", UIViewController, {

            init: function(){
              PlanetsViewController.$super.init.call(this);
              this.solarSystems = [
                {
                  name: 'Sol',
                  planets: [
                    {
                      name: "Mercury",
                      image: JSImage.initWithResourceName("MercuryIcon")
                    },
                    {
                      name: "Venus",
                      image: JSImage.initWithResourceName("VenusIcon")
                    },
                    {
                      name: "Earth",
                      image: JSImage.initWithResourceName("EarthIcon")
                    }
                    // ...
                  ]
                },
                // ...
              ];
            },

            numberOfSectionsInCollectionView: function(collectionView){
              return this.solarSystems.length;
            }

            numberOfCellsInCollectionViewSection: function(collectionView, section){
              var styem = this.solarSystems[section];
              return system.planets.length;
            }

            viewDidLoad: function(){
              PlanetsViewController.$super.viewDidLoad.call(this);
              this.collectionView.registerViewClassForReuseIdentifier('solar-system', UICollectionReusableView);
            },

            supplimentaryViewForCollectionViewAtIndexPath: function(collectionView, indexPath, kind){
              if (indexPath.length === 1){
                var header = collectionView.dequeueReusableViewWithIdentifier('solar-system', indexPath);
                var system = this.solarSystems[indexPath.section];
                header.nameLabel.text = system.name;
                return header;
              }
            }

          });
          ````
      - name: dequeueReusableViewWithIdentifier
        kind: method
        summary: Reuse or create a supplimentary view for the the given identifier
        arguments:
          - name: identifier
            type: String
            summary: The view identifier, matched with one that was passed to
              \`registerViewClassForReuseIdentifier()`
          - name: indexPath
            type: JSIndexPath
            summary: The index path for the newly created view
        description: |
          The collection view only displays supplimentary views that are visibile in the
          scrolling content area, and reuses them as the user scrolls.  This
          allows the collection view to perform well even when there are thousands of 
          cells and many sections in the collection.

          Typically, you'll register view classes when a collection view is
          created, and then use `dequeueReusableViewWithIdentifier()`.

          ````
          JSClass("PlanetsViewController", UIViewController, {

            init: function(){
              PlanetsViewController.$super.init.call(this);
              this.solarSystems = [
                {
                  name: 'Sol',
                  planets: [
                    {
                      name: "Mercury",
                      image: JSImage.initWithResourceName("MercuryIcon")
                    },
                    {
                      name: "Venus",
                      image: JSImage.initWithResourceName("VenusIcon")
                    },
                    {
                      name: "Earth",
                      image: JSImage.initWithResourceName("EarthIcon")
                    }
                    // ...
                  ]
                },
                // ...
              ];
            },

            numberOfSectionsInCollectionView: function(collectionView){
              return this.solarSystems.length;
            }

            numberOfCellsInCollectionViewSection: function(collectionView, section){
              var styem = this.solarSystems[section];
              return system.planets.length;
            }

            viewDidLoad: function(){
              PlanetsViewController.$super.viewDidLoad.call(this);
              this.collectionView.registerViewClassForReuseIdentifier('solar-header', SolarSystemHeaderView);
            },

            supplimentaryViewForCollectionViewAtIndexPath: function(collectionView, indexPath, kind){
              var header = collectionView.dequeueReusableViewWithIdentifier('solar-header', indexPath);
              var system = this.solarSystems[section];
              header.nameLabel.text = system.name;
              return header;
            }

          });
          ````
  - name: Loading Collection Data
    members:
      - name: reloadData
        kind: method
        summary: Called to intially load collection data and to reload the entire collection
        description: |
          When called, the collection view will ask its `dataSource` for information
          about the number of sections and cells, and will then proceed to ask
          for any cells that are currently visibile.

          ````
          JSClass("PlanetsViewController", UIViewController, {

            init: function(){
              PlanetsViewController.$super.init.call(this);
              this.solarSystems = [
                {
                  name: 'Sol',
                  planets: [
                    {
                      name: "Mercury",
                      image: JSImage.initWithResourceName("MercuryIcon")
                    },
                    {
                      name: "Venus",
                      image: JSImage.initWithResourceName("VenusIcon")
                    },
                    {
                      name: "Earth",
                      image: JSImage.initWithResourceName("EarthIcon")
                    }
                    // ...
                  ]
                },
                // ...
              ];
            },

            numberOfSectionsInCollectionView: function(collectionView){
              return this.solarSystems.length;
            }

            numberOfCellsInCollectionViewSection: function(collectionView, section){
              var styem = this.solarSystems[section];
              return system.planets.length;
            }

            viewDidLoad: function(){
              PlanetsViewController.$super.viewDidLoad.call(this);
              this.collectionView.reloadData();
            }
          });
          ````

          After the first load, you can reload individual cells or insert/remove
          cells without reloading the entire collection.
        see:
          - reloadCellsAtIndexPaths()
          - insertCellsAtIndexPaths()
          - deleteCellsAtIndexPaths()
          - insertSections()
          - deleteSections()

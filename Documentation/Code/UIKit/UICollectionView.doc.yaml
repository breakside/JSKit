      - name: UICollectionViewDefaultStyler
        namespace: UIKit
        kind: class
        inherits: UICollectionViewStyler
        summary: The default collection view styler for `UIKit`
      - name: styler
        type: UICollectionViewStyler
        summary: The styler in use for this collection view
        description: |
          Stylers allow for separation between the collection view's model and its
          presentation.

          One styler can be resused for many collection views of the same type.

          `UICollectionViewStyler` is provided as an abstract base class for subclasses
          to extend into specific stylers for their needs.
      - name: stylerProperties
        type: dictionary
        summary: A dictionary that a styler can use to store properties
          relating to styling
        description: |
          Often a styler will need to create views or layers to help its
          styling.  Since a single styler is used for multiple collection views,
          the styler can't store those view-specific properties on its own.

          So, `stylerProperties` is a place on each `UICollectionView` that a styler
          can store control-specific objects.
      - name: showsFocusRing
        type: boolean
        summary: Indicates if the default focus ring should be drawn
          around the collection view when it is a window's first responder
  - name: Cell Reuse
    members:
      - name: registerCellClassForReuseIdentifier
        kind: method
        summary: Tell the collection view which cell class should be used to create
          cells when requsting the given identifier
        arguments:
          - name: cellClass
            type: JSClass
            summary: The `UICollectionViewCell` subclass to use when dequeuing a cell
              with the given identifier
          - name: identifier
            type: String
            summary: The identifier that links to the cell class
        description: |
          The collection view only displays cells that are visibile in the scrolling
          content area, and reuses them as the user scrolls.  This allows the
          collection view to perform well even when there are thousands of cells in
          the collection.

          Typically, you'll register cell classes when a collection view is created,
          and then use `dequeueReusableCellWithIdentifier()` when a cell is
          required.

          ````
          JSClass("PlanetsViewController", UIViewController, {

            init: function(){
              PlanetsViewController.$super.init.call(this);
              this.planets = [
                {
                  name: "Mercury",
                  image: JSImage.initWithResourceName("MercuryIcon")
                },
                {
                  name: "Venus",
                  image: JSImage.initWithResourceName("VenusIcon")
                },
                {
                  name: "Earth",
                  image: JSImage.initWithResourceName("EarthIcon")
                }
                // ...
              ]
            },

            viewDidLoad: function(){
              PlanetsViewController.$super.viewDidLoad.call(this);
              this.collectionView.registerCellClassForReuseIdentifier('planet', PlanetCollectionCell);
            },

            cellForCollectionViewAtIndexPath: function(collectionView, indexPath){
              var cell = collectionView.dequeueReusableCellWithIdentifier('planet', indexPath);
              var planet = this.planets[indexPath.row];
              cell.nameLabel.text = planet.name;
              cell.imageView.image = planet.image;
              return cell;
            }

          });
          ````
      - name: registerCellClassForReuseIdentifier
        suffix: styler
        kind: method
        summary: Tell the collection view which cell class and styler should be used
          to create cells when requsting the given identifier
        arguments:
          - name: cellClass
            type: JSClass
            summary: The `UICollectionViewCell` subclass to use when dequeuing a cell
              with the given identifier
          - name: identifier
            type: String
            summary: The identifier that links to the cell class
          - name: styler
            type: UICollectionViewStyler
            summary: The styler to use for cells with the given identifier,
              overriding the collection view's `styler`
        description: |
          The collection view only displays cells that are visibile in the scrolling
          content area, and reuses them as the user scrolls.  This allows the
          collection view to perform well even when there are thousands of cells in
          the collection.

          Typically, you'll register cell classes when a collection view is created,
          and then use `dequeueReusableCellWithIdentifier()` when a cell is
          required.

          ````
          JSClass("PlanetsViewController", UIViewController, {

            init: function(){
              PlanetsViewController.$super.init.call(this);
              this.planets = [
                {
                  name: "Mercury",
                  image: JSImage.initWithResourceName("MercuryIcon")
                },
                {
                  name: "Venus",
                  image: JSImage.initWithResourceName("VenusIcon")
                },
                {
                  name: "Earth",
                  image: JSImage.initWithResourceName("EarthIcon")
                }
                // ...
              ]
            },

            viewDidLoad: function(){
              PlanetsViewController.$super.viewDidLoad.call(this);
              this.collectionView.registerCellClassForReuseIdentifier('planet', PlanetCollectionCell);
            },

            cellForCollectionViewAtIndexPath: function(collectionView, indexPath){
              var cell = collectionView.dequeueReusableCellWithIdentifier('planet', indexPath);
              var planet = this.planets[indexPath.row];
              cell.nameLabel.text = planet.name;
              cell.imageView.image = planet.image;
              return cell;
            }

          });
          ````
      - name: dequeueReusableCellWithIdentifier
        kind: method
        summary: Reuse or create a cell for the the given identifier
        arguments:
          - name: identifier
            type: String
            summary: The cell identifier, matched with one that was passed to
              \`registerCellClassForReuseIdentifier()`
          - name: indexPath
            type: JSIndexPath
            summary: The index path for the newly created cell
        description: |
          The collection view only displays cells that are visibile in the scrolling
          content area, and reuses them as the user scrolls.  This allows the
          collection view to perform well even when there are thousands of cells in
          the collection.

          Typically, you'll register cell classes when a collection view is created,
          and then use `dequeueReusableCellWithIdentifier()` when a cell is
          required.

          ````
          JSClass("PlanetsViewController", UIViewController, {

            init: function(){
              PlanetsViewController.$super.init.call(this);
              this.planets = [
                {
                  name: "Mercury",
                  image: JSImage.initWithResourceName("MercuryIcon")
                },
                {
                  name: "Venus",
                  image: JSImage.initWithResourceName("VenusIcon")
                },
                {
                  name: "Earth",
                  image: JSImage.initWithResourceName("EarthIcon")
                }
                // ...
              ]
            },

            viewDidLoad: function(){
              PlanetsViewController.$super.viewDidLoad.call(this);
              this.collectionView.registerCellClassForReuseIdentifier('planet', PlanetCollectionCell);
            },

            cellForCollectionViewAtIndexPath: function(collectionView, indexPath){
              var cell = collectionView.dequeueReusableCellWithIdentifier('planet', indexPath);
              var planet = this.planets[indexPath.row];
              cell.nameLabel.text = planet.name;
              cell.imageView.image = planet.image;
              return cell;
            }

          });
          ````

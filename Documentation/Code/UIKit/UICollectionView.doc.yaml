kind: class
introduced: 2022.10.0
inherits: UIScrollView
summary: Display and interact with a collection of items using a custom layout
description: |
  A `UICollection` is one of the most versatile componets of `UIKit`, and it
  takes inspiration from `UICollectionView`, while allowing more flexible and complex
  layouts of items.

  How a Collection View Gets Its Data
  =========
  The delegate and data source pattern is used often in `UIKit` as a way
  to separate generic control behaviors from an application's specific data.

  In the case of a `UICollection`, the `delegate` and `dataSource` combine to
  1. Populate the collection's cells
  2. Respond to user interaction with cells

  Typically, your `delegate` and `dataSource` are the same controller object,
  often a subclass of `UIViewController`.  Anything that implements the
  `UICollectionViewDelegate` and `UICollectionViewDataSource` protocols will do.

  The important delegate methods are:
  1. `collectionViewDidSelectCellAtIndexPath()`, which is called when a user clicks a
     cell

  The important data source methods are:
  1. `numberOfSectionsInCollectionView()`
  2. `numberOfCellsInCollectionViewSection()`
  3. `cellForCollectionViewAtIndexPath()`
  4. `supplimentaryViewForCollectionViewAtIndexPath()`

  which, when combined, tell the collection view how many items are included,
  and what view should be used for each item.

  Reusing Cells
  ==========
  Very large collections would cause perforance issues if `UICollectionView` created a
  view for each cell in the entire collection.

  Instead, `UICollectionView` creates only those cells that are visible in its
  scroll window.  As the user scrolls, cells that become invisible can be reused
  for cells that become visible.

  Typically you'll register cell classes with
  `registerCellClassForReuseIdentifier()`, when creating the collection view.

  Then, when the collection view calls for `cellForCollectionViewAtIndexPath()`,
  your delegate asks for a reusable cell with
  `dequeueReusableCellWithIdentifier()`, which will either return a reusable
  cell or create a new one if none are available for reuse.
topics:
  - name: Creating a Collection View
    members:
      - name: initWithLayout
        kind: init
        summary: Create a collection view with the given layout and styler
        arguments:
          - name: layout
            type: UICollectionViewLayout
            summary: The layout that determines where cells are places in the view
          - name: styler
            type: UICollectionViewStyler
            nullable: true
            default: "null"
            summary: The styler to use for this collection view (a default
              styler will be used if omitted)
      - name: Spec File Properties
        kind: spec
        summary: The properties available for `UICollectionView`s defined in spec
          files
        topics:
          - name: Delegate & Data Source
            members:
              - name: delegate
                type: UICollectionViewDelegate
                summary: The delegate object for this collection view
                description: |
                  A collection view's delegate is responsible for creating cells,
                  responding to user interaction, and otherwise filling in
                  application-specific logic that `UICollectionView` can't assume.

                  See the `UICollectionViewDelegate` documentation for more
                  information about implementing the delegate protocol.
                note: Often the object that acts as a collection view's `delegate`
                  also acts as its `dataSource`.
              - name: dataSource
                type: UICollectionViewDataSource
                summary: The data source object for this collection view
                description: |
                   A collection view's data source is required for every collection view.

                   It provides the basic information about how many sections
                   and cells are in the collection view.

                   The collection view uses this information to calculate its size
                   without having to draw all of its cells.  As the user
                   scrolls, the collection view asks its `delegate` for cells
                   that are in the visible area.
                note: Often the object that acts as a collection view's `dataSource`
                  also acts as its `delegate`.
          - name: Styling
            members:
              - name: styler
                type: UICollectionViewStyler
                summary: The styler to use for this collection view
              - name: showsFocusRing
                type: boolean
                summary: Indicates if the default focus ring should be drawn
                  around the collection view when it is a window's first responder
          - name: Layout
            members:
              - name: layout
                type: UICollectionViewLayout
                summary: The layout to use for cell placement
          - name: Cell Reuse
            members:
              - name: reusableCellClasses
                type: dictionary
                summary: Specifies which cell classes should be used for
                  which reuse identifiers
                description: |
                  The keys in this dictionary are the reuse identifiers.

                  The values can be either:
                  1. A `String` of the cell's class name
                  2. A `CellReuseInfo` dictionary

                  The cell's class should be `UICollectionViewCell` or one of its
                  subclasses.  Typically you'll create custom subclasses for
                  cells.

                  The short for simply maps an identifier to a class name.

                  ````
                  ViewController:
                    class: PlanetsViewController
                    view: /PlanetCollectionView

                  PlanetCollectionView:
                    class: UICollectionView
                    reusableCellClasses:
                      planet: PlanetCellView
                  ````

                  In your collection view delegate, you'll call
                  `dequeueReusableCellWithIdentifier()` using the `"planet"`
                  identifier from the spec file:
                  ````
                  JSClass("PlanetsViewController", UIViewController, {

                    cellForCollectionViewAtIndexPath: function(collectionView, indexPath){
                      var cell = collectionView.dequeueReusableCellWithIdentifier("planet", indexPath);
                      // cell is an instance of PlanetCellView
                      // ... configure cell as needed
                      return cell;
                    }

                  });
                  ````

                  The longer form allows you to override the styler used for cells
                  with this identifier.

                  ````
                  ViewController:
                    class: PlanetsViewController
                    view: /PlanetCollectionView

                  PlanetCollectionView:
                    class: UICollectionView
                    reusableCellClasses:
                      planet:
                        className: PlanetCellView
                        styler:
                          class: UICollectionViewDefaultStyler
                          cellFont:
                            size: detail
                            weight: bold
                  ````
              - name: CellReuseInfo
                kind: dictionary
                topics:
                  - name: Properties
                    members:
                      - name: className
                        type: String
                        summary: The name of the `UICollectionViewCell` subclass to
                          create when using the given identifier.
                      - name: styler
                        type: UICollectionViewStyler
                        summary: The styler to use for cells created using
                          the given identifier.
          - name: Supplimentary View Reuse
            members:
              -
                name: reusableViewClasses
                type: dictionary
                summary: Specifies which supplimentary view classes should be
                  used for which reuse identifiers
                description: |
                  The keys in this dictionary are the reuse identifiers.

                  The values are `String`s representing class names.

                  The cell's class should be `UICollectionReusableView` or one
                  of its subclasses.  Often you'll create custom subclasses
                  for headers and footers.

                  The dictionary simply maps an identifier to a class name.

                  ````
                  ViewController:
                    class: PlanetsViewController
                    view: /PlanetCollectionView

                  PlanetCollectionView:
                    class: UICollectionView
                    reusableViewClasses:
                      header: PlanetsHeaderView
                  ````

                  In your collection view delegate, you'll call
                  `dequeueReusableViewWithIdentifier()` using the `"header"`
                  identifier from the spec file:
                  ````
                  JSClass("PlanetsViewController", UIViewController, {

                    supplimentaryViewForCollectionViewAtIndexPath: function(collectionView, indexPath, kind){
                      var header = collectionView.dequeueReusableViewWithIdentifier("header", indexPath);
                      // header is an instance of PlanetsHeaderView
                      // ... configure cell as needed
                      return header;
                    }

                  });
                  ````
          - name: Selection
            members:
              - name: allowsMultipleSelection
                type: boolean
                summary: Indicates that the user can select multiple cells at a
                  time
              - name: allowsEmptySelection
                type: boolean
                summary: Indicates that the user can de-select all cells
                description: |
                  Defaults to `true`()
  - name: Delegate & Data Source
    members:
      - name: UICollectionViewDelegate
        namespace: UIKit
        kind: protocol
        summary: The interface a collection view delegate implements
        description: |
          The collection view's delegate is what responds to
          user interaction.

          While not all methods are required to implement, you'll likely at
          least implement `collectionViewDidSelectCellAtIndexPath()` to proide
          behaviors when the user interacts with cells.

          The collection view's `dataSource` is in charge of telling the
          collection view how many sections and cells there are, and providing
          those cells.
        topics:
          - name: Selection
            members:
              - name: collectionViewShouldSelectCellAtIndexPath
                optional: true
                type: boolean
                return: |
                  `true` if the cell can be selected, `false` otherwise
                summary: Indicates if a cell can be selected by the user
                arguments:
                  - name: collectionView
                    type: UICollectionView
                    summary: The collection view making the call
                  - name: indexPath
                    type: JSIndexPath
                    summary: The location of the cell in the collection
              - name: collectionViewDidSelectCellAtIndexPath
                optional: true
                summary: Called whent the user selects a cell
                arguments:
                  - name: collectionView
                    type: UICollectionView
                    summary: The collection view making the call
                  - name: indexPath
                    type: JSIndexPath
                    summary: The location of the cell in the collection
                description: |
                  Typically this is the call that triggers an action like
                  navigating to a new screen.

                  Selection occurs when the user performs a mouse down.

                  If you need to perform an action on mouse up, see
                  `collectionViewDidFinishSelectingCellAtIndexPath()`
                note: |
                  This is called when the user selects a single cell.
                  If you need to monitor multiple selection, use
                  `collectionViewSelectionDidChange()`.
              - name: collectionViewDidFinishSelectingCellAtIndexPath
                optional: true
                summary: Called when the selection is done, typically on
                  mouseUp
                arguments:
                  - name: collectionView
                    type: UICollectionView
                    summary: The collection view making the call
                  - name: indexPath
                    type: JSIndexPath
                    summary: The location of the cell in the collection
                description: |
                  Certain actions only make sense if the user has released
                  the mouse.
                note: This method is not typically used because most actions
                  should happen on `collectionViewDidSelectCellAtIndexPath()`
              - name: collectionViewDidOpenCellAtIndexPath
                optional: true
                summary: Called when the user performs an action like double
                  click or the enter key
                arguments:
                  - name: collectionView
                    type: UICollectionView
                    summary: The collection view making the call
                  - name: indexPath
                    type: JSIndexPath
                    summary: The location of the cell in the collection
                description: |
                  Distict from cell selection is the concept that the user
                  did an action typically associated with opening a resource.

                  Double click and Enter key are both considered open events.
              - name: collectionViewSelectionDidChange
                optional: true
                summary: 
                arguments:
                  - name: collectionView
                    type: UICollectionView
                    summary: The collection view making the call
                  - name: selectedIndexPaths
                    type: JSIndexPath[]
                    summary: The currently selected index paths
                description: |
                  Called when the selection changes.

                  While `collectionViewDidSelectCellAtIndexPath()` is useful for
                  single-selection collections, this method is more appropriate for
                  collections that allow mutliple selection.
                see:
                  - allowsMultipleSelection
          - name: Context menu
            members:
              - name: menuForCollectionViewCellAtIndexPath
                optional: true
                type: UIMenu
                nullable: true
                return: The context menu to show for the cell
                summary: Get the context menu for the cell
                arguments:
                  - name: collectionView
                    type: UICollectionView
                    summary: The collection view making the call
                  - name: indexPath
                    type: JSIndexPath
                    summary: The location of the cell in the collection
                description: |
                  A context menu can be requested by an action such as a
                  right click
          - name: Dragging cells
            members:
              - name: collectionViewShouldDragCellAtIndexPath
                optional: true
                type: boolean
                summary: Indicate if a cell can be dragged as copy/paste data
                arguments:
                  - name: collectionView
                    type: UICollectionView
                    summary: The collection view making the call
                  - name: indexPath
                    type: JSIndexPath
                    summary: The location of the cell in the collection
                description: |
                  If you return `true`, expect a subsequent call to
                  `pasteboardItemsForCollectionViewAtIndexPath()` to get the
                  pasteboard representation of the cell.
              - name: pasteboardItemsForCollectionViewAtIndexPath
                optional: true
                type: UIDragItem[]
                summary: Get the data items that correspond to the item at the
                  index path
                arguments:
                  - name: collectionView
                    type: UICollectionView
                    summary: The collection view making the call
                  - name: indexPath
                    type: JSIndexPath
                    summary: The location of the cell in the collection
                description: |
                  The items will be added to a `UIDraggingSession` and placed
                  on the session's `pasteboard`(UIDraggingSession.pasteboard).
              - name: collectionViewWillBeginDraggingSession
                optional: true
                summary: Called when the collection view is about to begin a dragging
                  session
                arguments:
                  - name: collectionView
                    type: UICollectionView
                    summary: The collection view making the call
                  - name: session
                    type: UIDraggingSession
                    summary: The dragging session
                description: |
                  Gives the delgate an opportunity to configure the session.

                  For example, the delegate can set the session's
                  `image`(UIDraggingSession.image).
          - name: Dragging Destination
            members:
              - name: collectionViewDraggingSessionDidEnter
                optional: true
                summary: Called when a drag session enters the collection view
                arguments:
                  - name: collectionView
                    type: UICollectionView
                    summary: The collection view
                  - name: session
                    type: UIDraggingSession
                    summary: The dragging session
              - name: collectionViewDraggingSessionDidUpdate
                optional: true
                summary: Called when a drag session moves over the collection view
                arguments:
                  - name: collectionView
                    type: UICollectionView
                    summary: The collection view
                  - name: session
                    type: UIDraggingSession
                    summary: The dragging session
                  - name: indexPath
                    type: JSIndexPath
                    nullable: true
                    summary: The index path of a cell that the drag is over, if any
              - name: collectionViewDraggingSessionDidExit
                optional: true
                summary: Called when a drag session exits the collection view
                arguments:
                  - name: collectionView
                    type: UICollectionView
                    summary: The collection view
                  - name: session
                    type: UIDraggingSession
                    summary: The dragging session
              - name: collectionViewPerformDragOperation
                optional: true
                summary: Called when a drop happens on the collection view
                arguments:
                  - name: collectionView
                    type: UICollectionView
                    summary: The collection view
                  - name: session
                    type: UIDraggingSession
                    summary: The dragging session
                  - name: operation
                    type: UIDragOperation
                    summary: The drop operation
                  - name: indexPath
                    type: JSIndexPath
                    nullable: true
                    summary: The index path of a cell that the drop is on, if any
      - name: UICollectionViewDataSource
        namespace: UIKit
        kind: protocol
        summary: An interface that's used to tell the collection view how many sections
          and cells to display.
        description: |
          A data source must be implemented for every collection view.

          After obtaining the size of the collection from its `dataSource`, the collection
          view will turn to its `delegate` for specifics about drawing and
          user interaction.
        topics:
          - name: Collection Size
            members:
              - name: numberOfSectionsInCollectionView
                type: Number
                summary: Get the number of sections in the collection view
                arguments: 
                  - name: collectionView
                    type: UICollectionView
                    summary: The collection view making the call
              - name: numberOfCellsInCollectionViewSection
                type: Number
                summary: The number of cells in the given section
                arguments: 
                  - name: collectionView
                    type: UICollectionView
                    summary: The collection view making the call
                  - name: section
                    type: Number
                    summary: The section to consider when counting cells
          - name: Cells & Views
            members:
              - name: cellForCollectionViewAtIndexPath
                summary: Get the cell for the given index path
                type: UICollectionViewCell
                return: A cell to display at the given index path
                arguments:
                  - name: collectionView
                    type: UICollectionView
                    summary: The collection view making the call
                  - name: indexPath
                    type: JSIndexPath
                    summary: The location of the cell in the collection
                description: |
                  This the primary function that populates collection views.

                  If you've called `registerCellClassForReuseIdentifier()` when
                  creating the collection view, then you'll call
                  `dequeueReusableCellWithIdentifier()` in this method.

                  ````
                  JSClass("PlanetsViewController", UIViewController, {

                    init: function(){
                      PlanetsViewController.$super.init.call(this);
                      this.planets = [
                        {
                          name: "Mercury",
                          image: JSImage.initWithResourceName("MercuryIcon")
                        },
                        {
                          name: "Venus",
                          image: JSImage.initWithResourceName("VenusIcon")
                        },
                        {
                          name: "Earth",
                          image: JSImage.initWithResourceName("EarthIcon")
                        }
                        // ...
                      ]
                    },

                    viewDidLoad: function(){
                      PlanetsViewController.$super.viewDidLoad.call(this);
                      this.collectionView.registerCellClassForReuseIdentifier('planet', PlanetCollectionCell);
                    },

                    cellForCollectionViewAtIndexPath: function(collectionView, indexPath){
                      var cell = collectionView.dequeueReusableCellWithIdentifier('planet', indexPath);
                      var planet = this.planets[indexPath.row];
                      cell.nameLabel.text = planet.name;
                      cell.imageView.image = planet.image;
                      return cell;
                    }

                  });
                  ````
              - name: supplimentaryViewForCollectionViewAtIndexPath
                optional: true
                summary: Get the supplimentary view for the section
                type: UICollectionReusableView
                return: The supplimentary view
                arguments:
                  - name: collectionView
                    type: UICollectionView
                    summary: The collection view making the call
                  - name: indexPath
                    type: JSIndexPath
                    summary: The index for the view, with 0, 1, or 2 componets
                  - name: kind
                    type: string
                    summary: The kind of supplimentary view, defined by the
                      collection's layout
                description: |
                  Works in a similar manner to cells.  Supplimentary view classes
                  must be registered using `registerViewClassForReuseIdentifier()`,
                  and then obtained with `dequeueReusableViewWithIdentifier()`.


                  The `indexPath`() and `kind`() arguments work together to identify
                  exactly which view is being requested.  For example, a
                  collection view using `UICollectionViewGridLayout` may be
                  send `kind=UICollectionViewGridLayout.SupplimentaryKind.header`
                  with various `indexPath`()s: a 0-length `indexPath`()
                  indicating a collection header and a 1-length `indexPath`()
                  indicating a section header.
      - name: delegate
        type: UICollectionViewDelegate
        nullable: true
        summary: The delegate object for this collection view
        description: |
          A collection view's delegate is responsible for creating cells,
          responding to user interaction, and otherwise filling in
          application-specific logic that `UICollectionView` can't assume.

          See the `UICollectionViewDelegate` documentation for more
          information about implementing the delegate protocol.
        note: Often the object that acts as a collection view's `delegate`
          also acts as its `dataSource`.
      - name: dataSource
        nullable: true
        type: UICollectionViewDataSource
        summary: The data source object for this collection view
        description: |
           A collection view's data source is required for every collection view.

           It provides the basic information about how many sections
           and cells are in the collection view.

           The collection view uses this information to calculate its size
           without having to draw all of its cells.  As the user
           scrolls, the collection view asks its `delegate` for cells
           that are in the visible area.
        note: Often the object that acts as a collection view's `dataSource`
          also acts as its `delegate`.
  - name: Layout
